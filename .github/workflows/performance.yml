name: Performance guard

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-benchmark:
    name: Release 10k regression gate
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run two-strike performance gate
        run: bash script/ci_performance_gate.sh
